<!DOCTYPE html>
<html>
<head>
  <style>
    table {
      border-collapse: collapse;
      width: 100%;
    }
    th, td {
      border: 1px solid black;
      padding: 8px;
      text-align: center;
    }
  </style>
</head>
<body>

<h2>Group Assessment</h2>

<table id="assessmentTable">
  <tr>
    <th>Group</th>
    <th>Plan</th>
    <th>Accuracy</th>
    <th>Teamwork</th>
    <th>Problem-Solving</th>
    <th>Comments</th>
  </tr>
  <tr>
    <td contenteditable="true">Group 1</td>
    <td contenteditable="true"></td>
    <td contenteditable="true"></td>
    <td contenteditable="true"></td>
    <td contenteditable="true"></td>
    <td contenteditable="true"></td>
  </tr>
  <!-- Add more rows for other groups -->
</table>

<br>
<button onclick="downloadAssessment()">Download Assessment</button>

<script>
function downloadAssessment() {
  let table = document.getElementById("assessmentTable");
  let rows = table.rows;
  let data = "";
  for (let i = 0; i < rows.length; i++) {
    let cells = rows[i].cells;
    for (let j = 0; j < cells.length; j++) {
      data += cells[j].innerText + (j == cells.length - 1 ? "\n" : ",");
    }
  }
  let blob = new Blob([data], { type: "text/csv" });
  let a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "assessment.csv";
  a.click();
}
</script>

</body>
</html>
